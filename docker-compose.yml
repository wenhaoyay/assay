# docker compose up --build    ->  web + API on http://localhost:8040, demo agent on :9040, Postgres on :5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gaugelab
      POSTGRES_PASSWORD: gaugelab
      POSTGRES_DB: gaugelab
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaugelab"]
      interval: 3s
      retries: 20

  demo-agent:
    build: .
    command: ["gaugelab", "demo-agent", "--host", "0.0.0.0", "--port", "9040"]
    ports: ["9040:9040"]

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://gaugelab:gaugelab@db:5432/gaugelab
      GAUGELAB_DEMO_AGENT_URL: http://demo-agent:9040
    # Migrate, load the demo (runs only once), then serve.
    command: ["sh", "-c", "gaugelab db upgrade && gaugelab seed --run && gaugelab serve --host 0.0.0.0 --port 8040"]
    ports: ["8040:8040"]
    depends_on:
      db: {condition: service_healthy}
      demo-agent: {condition: service_started}
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach Ollama on the host: http://host.docker.internal:11434

volumes:
  pgdata:
