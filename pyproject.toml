[project]
name = "assay"
version = "0.1.0"
description = "Local-first evaluation and regression testing for RAG chatbots and tool-using agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "python-multipart>=0.0.9",
  "keyring>=25",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["pypdf>=4.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["assay*", "acme_support*"]
where = [".", "examples"]

[tool.setuptools.package-data]
assay = ["evaluators/llm_judge/rubrics/*.yaml", "pricing/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "apps/api/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["assay"]
check_untyped_defs = true
