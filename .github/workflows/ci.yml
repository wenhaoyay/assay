name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - lint, types, tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,pdf]"
      - run: ruff check gaugelab apps/api tests examples conftest.py
      - run: mypy
      - run: pytest -q

  postgres:
    name: Postgres - migrations + full demo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: gaugelab, POSTGRES_PASSWORD: gaugelab, POSTGRES_DB: gaugelab}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gaugelab" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://gaugelab:gaugelab@localhost:5432/gaugelab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,postgres]"
      - run: gaugelab db upgrade
      - name: Models and migrations agree
        run: python -c "from alembic.config import Config; from alembic import command; command.check(Config('apps/api/alembic.ini'))"
      - run: gaugelab seed --run --trials 2
      - run: gaugelab ci benchmarks/acme_support/ci.yaml --out-dir pg-artifacts

  web:
    name: Web - lint, types, unit tests, build
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -e ".[dev]"
      - working-directory: apps/web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          GAUGELAB_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: playwright-traces, path: apps/web/test-results}

  eval-gate:
    name: Evaluation regression gate (zero API cost)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      # Deterministic evaluators + the heuristic judge only: no keys, no paid calls.
      # Exits 1 when a gate fails, which fails the workflow. The Markdown summary goes to the job summary.
      - run: gaugelab ci benchmarks/acme_support/ci.yaml --out-dir gaugelab-artifacts
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: gaugelab-evaluation, path: gaugelab-artifacts}
      - name: The gate catches a real regression
        run: |
          if gaugelab ci benchmarks/acme_support/ci-regression.yaml --out-dir regression-artifacts; then
            echo "Expected the regressed candidate to FAIL the gate"; exit 1
          fi
