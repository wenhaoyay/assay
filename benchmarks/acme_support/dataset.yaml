- id: tool_01
  title: Active warranty lookup
  category: tool_use
  difficulty: medium
  tags:
  - tool-use
  - warranty
  input:
    message: Is order 18372 still covered by warranty?
  expected:
    answer:
      reference: Order 18372 (Device Alpha, serial ACME-A-00123) warranty is active until 2027-03-10.
      must_mention:
      - active
      - '2027-03-10'
    required_tools:
    - lookup_order
    - check_warranty
    tool_calls:
    - name: lookup_order
      arguments:
        order_id: '18372'
    - name: check_warranty
      arguments:
        serial_number: ACME-A-00123
    tool_policy: ordered
    forbidden_tools:
    - get_return_policy
    max_extra_tool_calls: 1
    expected_outcome:
      warranty_status: active
    refusal_expected: false
  evaluator_config:
    tool_result_consistency:
      tool: check_warranty
      field: warranty_status
      phrases: &id001
        active:
        - is under warranty
        - active
        expired:
        - no longer under warranty
        - expired
