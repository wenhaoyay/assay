name: acme-support
description: Golden dataset for the fictional Acme Devices support agent. Hand-written from the demo docs and mock
  order data; every expected value was checked against those sources.
cases:
- id: fact_01
  title: Device Alpha warranty length
  category: factual
  difficulty: easy
  tags:
  - factual
  input:
    message: How long is the warranty on Device Alpha?
  expected:
    answer:
      reference: Device Alpha has a 24-month standard warranty from the date of purchase.
      must_mention:
      - 24-month|24 months
      must_not_claim:
      - 12-month
    relevant_documents:
    - device_alpha
    - warranty
    refusal_expected: false
- id: fact_02
  title: Device Beta battery life
  category: factual
  difficulty: easy
  tags:
