# Assay price table (USD per 1M tokens).
#
# Prices change. Every row needs the date it took effect and where it came from.
# A model that is not listed costs "unknown" in Assay - never zero, never a guess.
# Add rows for the cloud models you use, copied from the provider's current price page,
# or override them per project in the Settings page / the API (/api/pricing).
#
#   - provider: openai
#     model: <model id>
#     input_per_1m: <from the provider's price page>
#     output_per_1m: <from the provider's price page>
#     effective_from: <YYYY-MM-DD you checked>
#     source_note: "<URL> checked <date>"

prices:
  # Local models: no per-token charge. Hardware and electricity are not priced.
  - provider: ollama
    model: llama3.1:8b
    input_per_1m: 0
    output_per_1m: 0
    effective_from: "2024-01-01"
    source_note: "Local inference - no per-token charge (compute not priced)"

  # The demo agent's simulated model. FICTIONAL prices so the demo can show cost
  # trade-offs; they describe no real provider.
  - provider: acme-sim
    model: acme-sim-1
    input_per_1m: 0.40
    output_per_1m: 1.60
    effective_from: "2024-01-01"
    source_note: "Fictional demo price (Acme demo agent) - not a real provider"
